<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#0B1F3A">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{business_name}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Blue Route Logistics: pharmacy and medical courier services on Florida's Treasure Coast">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="{{root}}img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{root}}img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{root}}img/apple-touch-icon.png">
  <link rel="preload" href="{{root}}fonts/InterDisplay-Bold.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="{{root}}fonts/Inter-Regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="{{root}}css/site.css">
  <script src="{{root}}js/site.js" defer></script>
  {{head_extra}}
</head>
<body class="{{body_class}}">
  <a class="skip-link" href="#main">Skip to main content</a>
  {% include header.html %}
  <main id="main" tabindex="-1">
{{content}}
  </main>
  {% include footer.html %}
</body>
</html>
